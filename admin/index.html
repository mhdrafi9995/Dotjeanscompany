<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOT Jeans Co. — Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0f172a; --secondary: #334155; --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #1e293b; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .admin-nav { background: var(--surface); padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .admin-nav h1 { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .admin-nav button { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .admin-container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .admin-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .admin-tabs button { background: var(--surface); border: 1px solid var(--border); padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .admin-tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .admin-panel { display: none; background: var(--surface); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); }
        .admin-panel.active { display: block; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.875rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; box-sizing: border-box; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .btn-danger { background: var(--danger); }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        .data-table th { font-weight: 600; color: var(--secondary); background: #f1f5f9; }
        .colour-row, .size-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
        .colour-row input, .size-row input { flex: 1; }
    </style>
</head>
<body>

    <div id="app">
        <nav class="admin-nav">
            <h1>DOT Jeans Co. Admin</h1>
            <button onclick="logout()">Logout</button>
        </nav>
        <div class="admin-container">
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('products')">Products</button>
                <button class="tab-btn" onclick="switchTab('addProduct')">Add Product</button>
                <button class="tab-btn" onclick="switchTab('enquiries')">Enquiries</button>
            </div>

            <!-- Products List -->
            <div id="productsTab" class="admin-panel active">
                <h2>Manage Products</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Brand</th>
                            <th>Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Add/Edit Product -->
            <div id="addProductTab" class="admin-panel">
                <h2 id="formTitle">Add New Product</h2>
                <form id="productForm" onsubmit="saveProduct(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Brand</label>
                            <input type="text" id="pBrand" required value="CROSS COUNTRY">
                        </div>
                        <div class="form-group">
                            <label>Product Name / Fit</label>
                            <input type="text" id="pName" required placeholder="e.g. Straight Fit">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="pDesc" rows="4" required></textarea>
                    </div>

                    <!-- Images -->
                    <h3>Product Images (Existing Bucket: "Product Images")</h3>
                    <div class="form-group">
                        <label>Main Image (1 required)</label>
                        <input type="file" id="pMainImg" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Detail Images (Select up to 2)</label>
                        <input type="file" id="pDetailImgs" accept="image/*" multiple>
                    </div>

                    <!-- Colours -->
                    <h3>Colours (Up to 7)</h3>
                    <div id="coloursContainer">
                        <div class="colour-row">
                            <input type="text" class="c-name" placeholder="Colour Name (e.g. Blue)">
                            <input type="color" class="c-hex" value="#0000ff">
                        </div>
                    </div>
                    <button type="button" onclick="addColourRow()" style="margin-bottom:1rem">+ Add Colour</button>

                    <!-- Sizes & Stock -->
                    <h3>Sizes & Stock</h3>
                    <div id="sizesContainer">
                        <div class="size-row">
                            <input type="text" class="s-size" placeholder="Size (e.g. 28)" required>
                            <input type="number" class="s-qty" placeholder="Stock Qty (e.g. 3)" min="0" required>
                        </div>
                    </div>
                    <button type="button" onclick="addSizeRow()" style="margin-bottom:1rem">+ Add Size</button>

                    <hr style="border:0;border-top:1px solid var(--border);margin:1.5rem 0">
                    <button type="submit" class="btn">Save Product</button>
                    <p id="saveMessage" style="color:green; font-size:14px"></p>
                </form>
            </div>

            <!-- Enquiries -->
            <div id="enquiriesTab" class="admin-panel">
                <h2>Wholesale Enquiries</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Business</th>
                            <th>Contact</th>
                            <th>Product</th>
                            <th>Req (Qty)</th>
                        </tr>
                    </thead>
                    <tbody id="enquiriesTableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../admin.js"></script>
</body>
</html>
