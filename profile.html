<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — DOT Jeans Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --orange:#ff750b; --ink:#101218; --muted:#686d75; --line:#e9e9eb; --wash:#fafafa; }
        body { margin:0; background:var(--wash); color:var(--ink); font-family:"DM Sans",Arial,sans-serif; }
        button,input { font:inherit; }

        .layout { max-width:1405px; margin:120px auto 40px; padding:0 22px; display:grid; grid-template-columns:350px 1fr; gap:28px; }
        .sidebar,.panel { background:white; box-shadow:0 3px 16px #00000005; border-radius: 12px; }
        .sidebar { padding:26px 0; min-height:775px; }
        .side-head { display:flex; gap:19px; align-items:center; padding:0 31px 29px; }
        .side-avatar { width:58px; height:58px; border-radius:50%; background:#edf0f1; display:grid; place-items:center; font-size:30px; overflow:hidden; }
        .side-avatar img { width:100%; height:100%; object-fit:cover; display:none; }
        .side-head strong { font-size:25px; display:block; }
        .side-head span { color:var(--muted); font-size:16px; }
        
        .side-link { height:72px; display:flex; align-items:center; gap:27px; padding-left:31px; color:#34383e; font-size:20px; text-decoration:none; border-left:4px solid transparent; }
        .side-link span { width:32px; font-size:28px; text-align:center; }
        .side-link.active { background:#fff4eb; color:var(--orange); border-left-color:var(--orange); }
        
        .panel { padding:41px 33px 32px; }
        .summary { display:flex; align-items:center; gap:38px; padding:0 5px 40px; border-bottom:1px solid var(--line); }
        .photo { width:193px; height:193px; border-radius:50%; background:linear-gradient(140deg,#d5d9da,#85898c); display:grid; place-items:center; overflow:visible; flex-shrink:0; position:relative; }
        .photo img { width:100%; height:100%; border-radius:50%; object-fit:cover; position:absolute; inset:0; z-index:1; display:none; }
        .photo .silhouette { color:white; opacity:.9; font-size:103px; transform:translateY(15px); position:relative; z-index:0; }
        .camera { position:absolute; bottom:7px; right:2px; width:55px; height:55px; background:#191d21; color:white; border:4px solid white; border-radius:50%; display:grid; place-items:center; font-size:25px; z-index:2; cursor:pointer; }
        .summary-label,.field-label { color:var(--muted); font-size:18px; margin-bottom:9px; }
        .summary-value { font-weight:700; font-size:31px; margin-bottom:28px; }
        .summary-value:last-child { margin-bottom:0; }
        
        form { padding-top:35px; display:grid; gap:32px; }
        .field { height:83px; border:1px solid #e5e5e7; border-radius:15px; display:flex; align-items:center; padding:0 27px; gap:25px; background:#fff; }
        .field-icon { color:#3d444c; font-size:27px; width:30px; text-align:center; }
        .field-info { flex:1; display: flex; flex-direction: column; }
        .field-label { margin:0 0 5px; font-size:16px; }
        input { border:0; outline:0; padding:0; width:100%; color:#15171b; font-size:20px; background:transparent; }
        
        .photo-field { color:#565b61; font-size:17px; }
        .photo-field span:not(.field-icon) { flex:1; }
        .change { border:1px solid #ededee; border-radius:14px; color:#33383e; background:white; padding:13px 22px; cursor:pointer; font-size:17px; margin-left:auto; }
        
        .save {
            height: 70px;
            border: 0;
            border-radius: 14px;
            background: var(--orange);
            color: white;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 5px #ff750b35;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s ease, opacity 0.2s ease, transform 0.1s ease;
        }
        .save:hover:not(:disabled) {
            background: #e66808;
        }
        .save:active:not(:disabled) {
            transform: translateY(1px);
        }
        .save:disabled {
            opacity: 0.85;
            cursor: wait;
        }

        .profile-msg {
            display: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            align-items: center;
            gap: 12px;
            line-height: 1.4;
            animation: fadeInMsg 0.25s ease-out;
        }
        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-msg.error {
            display: flex;
            background: #fff2f0;
            color: #cf1322;
            border: 1px solid #ffccc7;
        }
        .profile-msg.success {
            display: flex;
            background: #f6ffed;
            color: #389e0d;
            border: 1px solid #b7eb8f;
        }
        .field.field-error {
            border-color: #ff4d4f !important;
            background: #fffbfa !important;
            box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.15);
        }
        
        @media (max-width:900px) {
            .layout { grid-template-columns:1fr; margin-top:100px; padding: 0 15px; } 
            .sidebar { min-height:0; } 
            .panel { padding:28px 20px; } 
        }
        @media (max-width:560px) { 
            .summary { align-items:flex-start; gap:20px; flex-direction:column; } 
            .photo { width:108px; height:108px; } 
            .photo .silhouette { font-size:60px; transform:translateY(8px); } 
            .camera { transform:scale(.7); transform-origin:bottom right; bottom:2px; right:-2px; } 
            .summary-value { font-size:23px; margin-bottom: 15px; } 
            .field { padding:0 16px; gap:12px; height:70px; } 
            .change { padding:10px; font-size:14px; } 
            form { gap: 20px; }
            .save { height: 60px; font-size: 19px; border-radius: 12px; }
            .profile-msg { font-size: 14px; padding: 12px 14px; }
        }
    </style>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
    <dot-navbar></dot-navbar>
    <script src="navbar.js"></script>

    <div class="layout">
        <aside class="sidebar">
            <div class="side-head">
                <div class="side-avatar">
                    <img src="" id="sidebarImg">
                    <span id="sidebarFallback">👤</span>
                </div>
                <div>
                    <strong>Profile</strong>
                    <span>Manage your account</span>
                </div>
            </div>
            <a href="profile.html" class="side-link active">
                <span>👤</span> Profile
            </a>
            <a href="profile.html" class="side-link">
                <span>⚙️</span> Account
            </a>
            <a href="javascript:void(0)" class="side-link" id="logoutBtn">
                <span>🚪</span> Logout
            </a>
        </aside>

        <section class="panel">
            <div class="summary">
                <div class="photo">
                    <img src="" id="mainImg">
                    <span class="silhouette" id="mainFallback">♟</span>
                    <label class="camera" for="photoUpload">▣</label>
                </div>
                <div>
                    <div class="summary-label">Shop Name</div>
                    <div class="summary-value" id="dispShop">Dot Jeans</div>
                    <div class="summary-label">Name</div>
                    <div class="summary-value" id="dispName">Muhammed Rafi</div>
                </div>
            </div>
            <form id="profileForm" novalidate>
                <div id="profileMsg" class="profile-msg" role="alert" style="display:none;"></div>
                <label class="field">
                    <span class="field-icon">♜</span>
                    <span class="field-info">
                        <span class="field-label">Shop Name</span>
                        <input id="inpShop" value="Dot Jeans" aria-label="Shop Name" required maxlength="100">
                    </span>
                </label>
                <label class="field">
                    <span class="field-icon">♙</span>
                    <span class="field-info">
                        <span class="field-label">Name</span>
                        <input id="inpName" value="Muhammed Rafi" aria-label="Name" required maxlength="100">
                    </span>
                </label>
                <div class="field photo-field">
                    <span class="field-icon">▧</span>
                    <span>Profile Photo</span>
                    <input type="file" id="photoUpload" style="display:none" accept="image/*">
                    <button type="button" class="change" onclick="document.getElementById('photoUpload').click()">Change Photo</button>
                </div>
                <button class="save" type="submit" id="saveBtn" aria-label="Save Profile">▣ &nbsp; Save Profile</button>
            </form>
        </section>
    </div>

    <script>
        // Authentication & Profile Logic
        document.addEventListener('DOMContentLoaded', async () => {
            let userSession = null;
            let userId = null;
            
            // Wait for Supabase to be ready if still initializing
            let retries = 0;
            while ((typeof supabase === 'undefined' || !supabase.auth) && retries < 50) {
                await new Promise(r => setTimeout(r, 100));
                retries++;
            }
            
            if (typeof supabase !== 'undefined' && supabase.auth) {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    userSession = session;
                    if (session && session.user) userId = session.user.id;
                } catch(e) {}
            }
            
            let localUserStr = localStorage.getItem('dot_user');
            let localUser = localUserStr ? JSON.parse(localUserStr) : {
                name: 'Muhammed Rafi',
                shopName: 'Dot Jeans',
                avatar: ''
            };
            if (!localUser.avatar) {
                localUser.avatar = localStorage.getItem('dot_user_photo') || '';
            }
            if (!localUser.name && localStorage.getItem('dot_user_name')) {
                localUser.name = localStorage.getItem('dot_user_name');
            }
            if (!localUser.shopName && localStorage.getItem('dot_shop_name')) {
                localUser.shopName = localStorage.getItem('dot_shop_name');
            }

            const updateUI = (name, shopName, avatarUrl) => {
                const dName = name || 'Muhammed Rafi';
                const dShop = shopName || 'Dot Jeans';
                
                document.getElementById('dispShop').textContent = dShop;
                document.getElementById('dispName').textContent = dName;
                document.getElementById('inpShop').value = dShop;
                document.getElementById('inpName').value = dName;
                
                if (avatarUrl) {
                    document.getElementById('mainImg').src = avatarUrl;
                    document.getElementById('mainImg').style.display = 'block';
                    document.getElementById('mainFallback').style.display = 'none';
                    
                    document.getElementById('sidebarImg').src = avatarUrl;
                    document.getElementById('sidebarImg').style.display = 'block';
                    document.getElementById('sidebarFallback').style.display = 'none';
                } else {
                    document.getElementById('mainImg').style.display = 'none';
                    document.getElementById('mainFallback').style.display = 'block';
                    document.getElementById('sidebarImg').style.display = 'none';
                    document.getElementById('sidebarFallback').style.display = 'inline-block';
                }
            };
            
            let currentAvatar = localUser.avatar;
            updateUI(localUser.name, localUser.shopName, localUser.avatar);
            
            // Image compressor / resizer to safely fit in localStorage & Supabase without QuotaExceededError
            const processImageFile = (file, callback) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const maxDim = 400;
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) {
                                h = Math.round((h * maxDim) / w);
                                w = maxDim;
                            } else {
                                w = Math.round((w * maxDim) / h);
                                h = maxDim;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const optimizedUrl = canvas.toDataURL('image/jpeg', 0.88);
                        callback(optimizedUrl);
                    };
                    img.onerror = function() {
                        callback(evt.target.result);
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            };

            if (userSession && typeof supabase !== 'undefined' && supabase.auth && userId) {
                try {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('full_name, shop_name, avatar_url, phone, mobile')
                        .eq('id', userId)
                        .maybeSingle();
                        
                    if (profile) {
                        localUser.name = profile.full_name || localUser.name;
                        localUser.full_name = profile.full_name || localUser.full_name;
                        localUser.shopName = profile.shop_name || localUser.shopName;
                        localUser.shop_name = profile.shop_name || localUser.shop_name;
                        if (profile.avatar_url) {
                            localUser.avatar = profile.avatar_url;
                            currentAvatar = profile.avatar_url;
                        }
                        if (profile.mobile || profile.phone) {
                            localUser.mobile = profile.mobile || profile.phone;
                            localUser.phone = profile.phone || profile.mobile;
                        }
                        updateUI(localUser.name, localUser.shopName, localUser.avatar);

                        try {
                            localStorage.setItem('dot_user', JSON.stringify(localUser));
                            if (localUser.name) localStorage.setItem('dot_user_name', localUser.name);
                            if (localUser.shopName) localStorage.setItem('dot_shop_name', localUser.shopName);
                            if (localUser.avatar) localStorage.setItem('dot_user_photo', localUser.avatar);
                            if (localUser.mobile) localStorage.setItem('dot_user_mobile', localUser.mobile);
                        } catch(e) {}

                        window.dispatchEvent(new CustomEvent('dot_profile_updated', {
                            detail: { photo: localUser.avatar, name: localUser.name, shop: localUser.shopName, mobile: localUser.mobile || '' }
                        }));
                        if (window.dotUpdateNavbarProfile) window.dotUpdateNavbarProfile();
                    }
                } catch(e) {}
            }

            // Error display helpers
            const msgEl = document.getElementById('profileMsg');
            const showError = (text, inputEl) => {
                if (msgEl) {
                    msgEl.className = 'profile-msg error';
                    msgEl.innerHTML = `<span>⚠️</span> <span>${text}</span>`;
                    msgEl.style.display = 'flex';
                    msgEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                if (inputEl) {
                    const field = inputEl.closest('.field');
                    if (field) field.classList.add('field-error');
                    inputEl.focus();
                }
            };

            const clearFieldError = (inputEl) => {
                if (inputEl) {
                    const field = inputEl.closest('.field');
                    if (field) field.classList.remove('field-error');
                }
                if (msgEl && msgEl.classList.contains('error')) {
                    const hasOtherErrors = document.querySelector('.field.field-error');
                    if (!hasOtherErrors) {
                        msgEl.style.display = 'none';
                    }
                }
            };

            const inpShop = document.getElementById('inpShop');
            const inpName = document.getElementById('inpName');
            if (inpShop) inpShop.addEventListener('input', () => clearFieldError(inpShop));
            if (inpName) inpName.addEventListener('input', () => clearFieldError(inpName));

            document.getElementById('photoUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    processImageFile(file, function(optimizedUrl) {
                        currentAvatar = optimizedUrl;
                        document.getElementById('mainImg').src = currentAvatar;
                        document.getElementById('mainImg').style.display = 'block';
                        document.getElementById('mainFallback').style.display = 'none';
                        
                        document.getElementById('sidebarImg').src = currentAvatar;
                        document.getElementById('sidebarImg').style.display = 'block';
                        document.getElementById('sidebarFallback').style.display = 'none';

                        // Instantly reflect in local state and top navbar
                        try {
                            localUser.avatar = currentAvatar;
                            localStorage.setItem('dot_user', JSON.stringify(localUser));
                            localStorage.setItem('dot_user_photo', currentAvatar);
                        } catch(err) {
                            console.warn('Staging photo to localStorage warning:', err);
                        }
                        window.dispatchEvent(new CustomEvent('dot_profile_updated', {
                            detail: { photo: currentAvatar, name: localUser.name, shop: localUser.shopName }
                        }));
                        if (window.dotUpdateNavbarProfile) window.dotUpdateNavbarProfile();
                    });
                }
            });
            
            // Save Profile Handler
            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                // Clear previous alerts
                if (msgEl) {
                    msgEl.style.display = 'none';
                    msgEl.className = 'profile-msg';
                    msgEl.innerHTML = '';
                }
                document.querySelectorAll('.field.field-error').forEach(f => f.classList.remove('field-error'));

                const shopVal = (inpShop ? inpShop.value : '').trim();
                const nameVal = (inpName ? inpName.value : '').trim();

                // 1. Validate fields before saving
                if (!shopVal) {
                    showError('Please enter a Shop Name.', inpShop);
                    return;
                }
                if (shopVal.length < 2) {
                    showError('Shop Name must be at least 2 characters long.', inpShop);
                    return;
                }

                if (!nameVal) {
                    showError('Please enter your Name.', inpName);
                    return;
                }
                if (nameVal.length < 2) {
                    showError('Name must be at least 2 characters long.', inpName);
                    return;
                }

                const btn = document.getElementById('saveBtn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '↻ Saving...';
                btn.disabled = true;

                // Sync latest session if available
                if (!userId && typeof supabase !== 'undefined' && supabase.auth) {
                    try {
                        const { data: { session } } = await supabase.auth.getSession();
                        if (session && session.user) {
                            userSession = session;
                            userId = session.user.id;
                        }
                    } catch(err) {}
                }

                // 2. Prepare user details
                localUser.name = nameVal;
                localUser.full_name = nameVal;
                localUser.shopName = shopVal;
                localUser.shop_name = shopVal;
                localUser.avatar = currentAvatar;

                // 3. Save to localStorage
                try {
                    localStorage.setItem('dot_user', JSON.stringify(localUser));
                    localStorage.setItem('dot_shop_name', shopVal);
                    localStorage.setItem('dot_user_name', nameVal);
                    if (currentAvatar) {
                        localStorage.setItem('dot_user_photo', currentAvatar);
                    }
                } catch(err) {
                    console.error('localStorage error on save:', err);
                    showError('Could not save profile locally (storage quota reached). Try choosing a smaller photo.', null);
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    return; // Stay on the Profile page
                }

                // 4. Save to Supabase (if authenticated)
                if (userSession && typeof supabase !== 'undefined' && supabase.auth && userId) {
                    try {
                        const profileUpdate = {
                            id: userId,
                            full_name: nameVal,
                            shop_name: shopVal,
                            avatar_url: currentAvatar || null,
                            updated_at: new Date().toISOString()
                        };
                        if (localUser.mobile || localUser.phone) {
                            profileUpdate.mobile = localUser.mobile || localUser.phone;
                            profileUpdate.phone = localUser.phone || localUser.mobile;
                        }

                        const { error: upsertErr } = await supabase
                            .from('profiles')
                            .upsert(profileUpdate, { onConflict: 'id' });

                        if (upsertErr) {
                            throw upsertErr;
                        }

                        // Update auth user metadata
                        try {
                            await supabase.auth.updateUser({
                                data: { full_name: nameVal, shop_name: shopVal, avatar_url: currentAvatar || null }
                            });
                        } catch (metaErr) {
                            console.warn('Metadata update notice:', metaErr);
                        }
                    } catch (dbErr) {
                        console.error('Supabase profile save error:', dbErr);
                        showError('Failed to save profile to server: ' + (dbErr.message || 'Network error') + '. Please try again.', null);
                        btn.innerHTML = originalHtml;
                        btn.disabled = false;
                        return; // Stay on the Profile page on failure
                    }
                }

                // 5. Update local UI & trigger navbar updates
                updateUI(nameVal, shopVal, currentAvatar);

                window.dispatchEvent(new CustomEvent('dot_profile_updated', {
                    detail: { photo: currentAvatar, name: nameVal, shop: shopVal, mobile: localUser.mobile || '' }
                }));
                if (window.dotUpdateNavbarProfile) {
                    window.dotUpdateNavbarProfile();
                }

                // 6. Navigate directly to the Home Page (index.html)
                // Works automatically without requiring an intermediate page or another click
                btn.innerHTML = '✓ Saved! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 350);
            });
            
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                if (typeof supabase !== 'undefined' && supabase.auth) {
                    try { await supabase.auth.signOut(); } catch(e) {}
                }
                localStorage.removeItem('dot_user');
                localStorage.removeItem('dot_user_name');
                localStorage.removeItem('dot_user_mobile');
                localStorage.removeItem('dot_shop_name');
                localStorage.removeItem('dot_user_photo');
                try {
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const k = localStorage.key(i);
                        if (k && (k.startsWith('sb-') && k.endsWith('-auth-token'))) {
                            localStorage.removeItem(k);
                        }
                    }
                } catch(e) {}
                window.dispatchEvent(new CustomEvent('dot_profile_updated', { detail: { photo: '', name: '', mobile: '', shop: '' } }));
                if (window.dotUpdateNavbarProfile) window.dotUpdateNavbarProfile();
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
